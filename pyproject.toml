[project]
name = "ohsome-api"
version = "2.0.0a6"
description = "HTTP API for OpenStreetMap history statistics and extractions."
readme = "README.md"
authors = [
    { name = "HeiGIT gGmbH", email = "ohsome@heigit.org" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "fastapi-cli>=0.0.24",
    "geojson-pydantic>=2.1.1",
    "ohsome-filter-to-sql>=0.14.0",
    "ohsomedb-schema",
    "pyarrow>=24.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyproj>=3.7.2",
    "shapely>=2.1.2",
]
[project.urls]
Homepage = "https://heigit.org/big-spatial-data-analytics/"
Contact = "https://heigit.org/contact"
Repository = "https://gitlab.heigit.org/giscience/big-data/ohsome/ohsome-api"
Documentation = "https://docs.ohsome.org/ohsome-api/v2-rc"
Swagger = "https://api.heigit.org/ohsome-api/v2-rc/docs"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.135.1",
    "prek>=0.4.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
    "schemathesis>=4.22.4",
    "shapely>=2.1.2",
    "testcontainers[postgres]>=4.14.1",
    "ty>=0.0.56",
]
docs = [
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "pyarrow>=24.0.0",
    "sphinx>=9.1.0",
    "sphinx-tabs>=3.5.0",
]

[tool.fastapi]
entrypoint = "ohsome_api.api:app"

[tool.uv.sources]
ohsomedb-schema = { git = "https://gitlab.heigit.org/giscience/big-data/ohsome/ohsomedb/ohsomedb-schema.git", tag = "0.1.1" }
