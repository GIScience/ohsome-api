[project]
name = "ohsome-api"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HeiGIT gGmbH", email = "ohsome@heigit.org" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "fastapi-cli>=0.0.24",
    "geojson-pydantic>=2.1.1",
    "ohsome-filter-to-sql>=0.8.0",
    "ohsomedb-schema",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.135.1",
    "prek>=0.3.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff==0.15.5",
    "testcontainers[postgres]>=4.14.1",
    "ty>=0.0.21",
]

[tool.fastapi]
entrypoint = "ohsome_api.api:app"

[tool.uv.sources]
ohsomedb-schema = { git = "https://gitlab.heigit.org/giscience/big-data/ohsome/ohsomedb/ohsomedb-schema.git", tag = "0.1.1" }
