[project]
name = "ohsome-api"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HeiGIT gGmbH", email = "ohsome@heigit.org" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "fastapi-cli>=0.0.24",
]

[project.scripts]
ohsome-api = "ohsome_api:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.135.1",
    "prek>=0.3.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff==0.15.5",
    "ty>=0.0.21",
]

[tool.fastapi]
entrypoint = "ohsome_api.main:app"
